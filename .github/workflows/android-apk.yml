name: Android APK

# Unzips StykAnimate-Mobile-AI.zip and builds Capacitor debug APK.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          ZIP=""
          for f in StykAnimate-Mobile-AI.zip StykMobile-Android.zip; do
            if [ -f "$f" ]; then ZIP="$f"; break; fi
          done
          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found"
            ls -la
            exit 1
          fi
          echo "Using ZIP: $ZIP ($(du -h "$ZIP" | cut -f1))"
          unzip -q -o "$ZIP"

          if [ -d styk-mobile ]; then
            echo "Extracted styk-mobile/"
            shopt -s dotglob
            mv styk-mobile/* .
            rmdir styk-mobile || true
            shopt -u dotglob
          elif [ -d StykAnimate-App-main ]; then
            echo "Extracted StykAnimate-App-main/"
            shopt -s dotglob
            mv StykAnimate-App-main/* .
            rmdir StykAnimate-App-main || true
            shopt -u dotglob
          fi

          test -f package.json || { echo "package.json missing"; ls -la; exit 1; }
          test -d mobile || { echo "mobile/ missing"; exit 1; }
          echo "Project root OK"
          ls -la | head -25
          ls src/ai/ 2>/dev/null || echo "(no src/ai)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web build dependencies
        run: npm ci --ignore-scripts

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Unit tests of the wrapper
        working-directory: mobile
        run: npm test

      - name: Create the Android project
        working-directory: mobile
        run: npm run android:add

      - name: App icons
        working-directory: mobile
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --assetPath resources

      - name: Build web + sync to Android
        working-directory: mobile
        run: npm run android:sync

      - name: Ensure AI assets in www + CapacitorHttp
        run: |
          set -e
          if [ -d src/ai ]; then
            mkdir -p mobile/www/src/ai
            cp -a src/ai/. mobile/www/src/ai/
            echo "Copied src/ai → mobile/www/src/ai"
            ls -la mobile/www/src/ai/
          fi
          # Patch index.html in www if AI script missing but files exist
          if [ -f mobile/www/index.html ] && [ -d mobile/www/src/ai ]; then
            if ! grep -q "src/ai/" mobile/www/index.html; then
              # Prefer panel bootstrap if present
              ENTRY=""
              for f in ai-panel.mjs ai-bootstrap.mjs ai-chat.mjs; do
                if [ -f "mobile/www/src/ai/$f" ]; then ENTRY="$f"; break; fi
              done
              if [ -n "$ENTRY" ]; then
                sed -i "s#</body>#    <script type=\"module\" src=\"./src/ai/${ENTRY}\"></script>\n  </body>#" mobile/www/index.html
                echo "Injected script: $ENTRY"
              fi
            fi
          fi
          if [ -f mobile/capacitor.config.json ]; then
            node -e "
              const fs=require('fs');
              const p='mobile/capacitor.config.json';
              const c=JSON.parse(fs.readFileSync(p,'utf8'));
              c.plugins=c.plugins||{};
              c.plugins.CapacitorHttp={enabled:true};
              c.android=c.android||{};
              c.android.allowMixedContent=true;
              fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');
              console.log('CapacitorHttp enabled');
            "
          fi

      - name: Re-copy assets into Android
        working-directory: mobile
        run: npx cap copy android

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        run: |
          APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK"
          ls -lh "$APK" || true

      - uses: actions/upload-artifact@v4
        with:
          name: styk-mobile-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
